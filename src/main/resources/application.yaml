spring:
  application:
    name: yy
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${yy.datasource.url}
    username: ${yy.datasource.username}
    password: ${yy.datasource.password}
    driver-class-name: ${yy.datasource.driver-class-name}
  data:
    redis:
      host: ${yy.redis.host}
      port: ${yy.redis.port}
      password: ${yy.redis.password}
      database: ${yy.redis.database}
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ecnu.controller
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecnu.model.entity
  configuration:
    map-underscore-to-camel-case: true
yy:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    secret-key: ecnu-yy-system-2026-06-secret-key-123456
    # 设置jwt过期时间
    ttl: 7200000
    # 设置前端传递过来的令牌名称
    token-name: token
  alioss:
    endpoint: ${yy.alioss.endpoint}
    access-key-id: ${yy.alioss.access-key-id}
    access-key-secret: ${yy.alioss.access-key-secret}
    bucket-name: ${yy.alioss.bucket-name}

